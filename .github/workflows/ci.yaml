name: CI

on:
  push:
  pull_request:

jobs:
  flutter:
    name: Flutter (analyze e testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.7
          channel: stable
      - name: Cria os arquivos de configuração a partir dos exemplos
        run: |
          cp lib/firebase_options.example.dart lib/firebase_options.dart
          cp lib/supabase_config.example.dart lib/supabase_config.dart
      - run: flutter pub get
      # --no-fatal-infos: os infos são dívida de lint do código herdado; o gate
      # ainda falha em warnings e errors reais.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  firestore-rules:
    name: Regras do Firestore (emulador)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
        working-directory: firebase/rules-tests
      - run: npm install -g firebase-tools
      - run: firebase emulators:exec --only firestore --project=demo-clickboard "npm --prefix firebase/rules-tests test"
